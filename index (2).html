<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Study Blueprint – Class 10</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14182b;--mu:#5b6280;--ac:#4f46e5;--bd:#e2e5f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--tx:#eceefa;--mu:#9aa1c4;--ac:#818cf8;--bd:#2a3050}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:28px 16px 18px;text-align:center}h1{margin:0;font-size:clamp(26px,5vw,40px);letter-spacing:-.5px}
h1 span{color:var(--ac)}header p{margin:6px 0 0;color:var(--mu)}
.top{display:flex;gap:6px;justify-content:flex-end;padding:10px 12px 0}header{padding-top:4px}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;max-width:1100px;margin:auto}
nav button,.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
nav button.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1100px;margin:auto;padding:8px 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
.bar input{flex:1;min-width:180px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px}.card p{margin:0;color:var(--mu);font-size:14px;white-space:pre-wrap}
.tag{font-size:12px;color:var(--ac);font-weight:600}.meta{font-size:12px;color:var(--mu)}
iframe,video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
a.btn,button.btn{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:10px;text-decoration:none;cursor:pointer;font:inherit;font-size:14px;text-align:center}
button.del{background:transparent;color:#d33;border:1px solid #d33;border-radius:8px;padding:5px 10px;cursor:pointer;margin-top:auto}
.empty{text-align:center;color:var(--mu);padding:50px 0}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(480px,92vw);padding:18px}
dialog form{display:grid;gap:10px}dialog::backdrop{background:#0008}
.row{display:flex;gap:8px}.hide{display:none!important}
.setup{background:#fff3cd;color:#664d03;padding:12px;border-radius:10px;margin:10px 16px;text-align:center}
</style></head><body>
<div class="top"><button class="chip" id="loginBtn">Admin</button> <button class="chip hide" id="addBtn">+ Upload</button> <button class="chip hide" id="outBtn">Logout</button></div>
<header><h1>The Study <span>Blueprint</span></h1><p>Class 10 • Notes, videos, PYQs, tests &amp; updates — all in one place</p></header>
<div id="setup" class="setup hide">Add your Supabase URL and anon key in index.html (see README).</div>
<nav id="tabs"></nav>
<main>
 <div class="bar"><input id="q" placeholder="Search this section…"><div id="subs" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
 <div id="list" class="grid"></div>
</main>

<dialog id="loginD"><form id="loginF"><h3>Admin login</h3><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" required><div class="row"><button class="btn" style="flex:1">Login</button><button type="button" class="chip" onclick="loginD.close()">Cancel</button></div><small id="loginMsg" class="meta"></small></form></dialog>

<dialog id="addD"><form id="addF"><h3>Upload material</h3>
 <select id="fSec"></select>
 <input id="fTitle" placeholder="Title" required>
 <select id="fSub"></select>
 <textarea id="fDesc" rows="3" placeholder="Description / announcement text"></textarea>
 <select id="fKind"><option value="text">Text only</option><option value="youtube">YouTube video link</option><option value="video">Upload video file</option><option value="file">Upload PDF / image / file</option><option value="link">External link (e.g. Google Form, CBSE site)</option></select>
 <input id="fUrl" placeholder="Paste link" class="hide">
 <input id="fFile" type="file" class="hide">
 <label id="fTimeW" class="hide meta">Test date &amp; time<input id="fTime" type="datetime-local"></label>
 <div class="row"><button class="btn" style="flex:1" id="fGo">Publish</button><button type="button" class="chip" onclick="addD.close()">Cancel</button></div>
 <small id="addMsg" class="meta"></small></form></dialog>

<script>
const SB_URL='https://bllsqlwxtopxfivqqgfi.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsbHNxbHd4dG9weGZpdnFxZ2ZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTIwODMsImV4cCI6MjEwNzk4ODA4M30.pIAUr05Z578X7uIZGJSLbZ5vfRdYD79rQNNlbvCPeuc';
const SECTIONS=[['notes','Notes'],['pyq','PYQs Analysis'],['sample','Sample Paper Questions'],['cbse','CBSE Notice & Official Files'],['live','Live Test'],['announce','Channel & Website Notice']];
const SUBJECTS=['Maths','Science','Social Science','English','Hindi','Other'];
const $=id=>document.getElementById(id);
const ok=SB_URL.startsWith('http');
if(!ok)$('setup').classList.remove('hide');
const sb=ok?supabase.createClient(SB_URL,SB_KEY):null;
let cur='notes',sub='All',admin=false,rows=[];

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const safe=u=>/^https?:\/\//i.test(u||'')?u:'#';
function ytId(u){const m=(u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);return m&&m[1]}

function tabs(){const t=$('tabs');t.innerHTML='';SECTIONS.forEach(([id,n])=>{const b=el('button',id===cur?'on':'',n);b.onclick=()=>{cur=id;sub='All';tabs();load()};t.append(b)});
 const s=$('subs');s.innerHTML='';['All',...SUBJECTS].forEach(n=>{const b=el('button','chip'+(n===sub?' on':''),n);b.onclick=()=>{sub=n;tabs();draw()};s.append(b)})}
$('fSec').innerHTML=SECTIONS.map(([i,n])=>`<option value="${i}">${n}</option>`).join('');
$('fSub').innerHTML=SUBJECTS.map(n=>`<option>${n}</option>`).join('');

async function load(){if(!sb)return draw();const{data,error}=await sb.from('materials').select('*').eq('section',cur).order('created_at',{ascending:false});if(error){$('setup').textContent='Could not load content: '+error.message;$('setup').classList.remove('hide')}rows=error?[]:data;draw()}
function draw(){const L=$('list');L.innerHTML='';const q=$('q').value.toLowerCase();
 const f=rows.filter(r=>(sub==='All'||r.subject===sub)&&(r.title+' '+(r.description||'')).toLowerCase().includes(q));
 if(!f.length){L.append(el('div','empty','Nothing here yet — check back soon!'));return}
 f.forEach(r=>{const c=el('div','card');
  if(r.kind==='youtube'&&ytId(r.url)){const i=document.createElement('iframe');i.src='https://www.youtube-nocookie.com/embed/'+ytId(r.url);i.allowFullscreen=true;i.loading='lazy';c.append(i)}
  if(r.kind==='video'){const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=safe(r.url);c.append(v)}
  if(r.subject)c.append(el('div','tag',r.subject));
  c.append(el('h3','',r.title));
  if(r.description)c.append(el('p','',r.description));
  if(r.test_time)c.append(el('div','meta','🕒 Test: '+new Date(r.test_time).toLocaleString()));
  if(r.kind==='file'||r.kind==='link'){const a=el('a','btn',r.section==='live'?'Start test':r.kind==='file'?'Open / Download':'Open link');a.href=safe(r.url);a.target='_blank';a.rel='noopener';c.append(a)}
  c.append(el('div','meta','Posted '+new Date(r.created_at).toLocaleDateString()));
  if(admin){const d=el('button','del','Delete');d.onclick=()=>del(r);c.append(d)}
  L.append(c)})}
$('q').oninput=draw;

async function del(r){if(!confirm('Delete "'+r.title+'"?'))return;
 if(r.kind==='file'||r.kind==='video'){const p=(r.url||'').split('/object/public/materials/')[1];if(p)await sb.storage.from('materials').remove([decodeURIComponent(p)])}
 await sb.from('materials').delete().eq('id',r.id);load()}

async function checkAdmin(){if(!sb)return;const{data:{session}}=await sb.auth.getSession();admin=false;
 if(session){const{data}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();admin=!!data}
 $('loginBtn').classList.toggle('hide',!!session);$('outBtn').classList.toggle('hide',!session);$('addBtn').classList.toggle('hide',!admin);draw()}
$('loginBtn').onclick=()=>loginD.showModal();
$('outBtn').onclick=async()=>{await sb.auth.signOut();checkAdmin()};
$('loginF').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
 if(error)$('loginMsg').textContent=error.message;else{loginD.close();checkAdmin()}};

$('addBtn').onclick=()=>{$('fSec').value=cur;kindUI();addD.showModal()};
function kindUI(){const k=$('fKind').value;$('fUrl').classList.toggle('hide',!(k==='youtube'||k==='link'));$('fFile').classList.toggle('hide',!(k==='video'||k==='file'));$('fTimeW').classList.toggle('hide',$('fSec').value!=='live')}
$('fKind').onchange=kindUI;$('fSec').onchange=kindUI;
$('addF').onsubmit=async e=>{e.preventDefault();const m=$('addMsg'),k=$('fKind').value;$('fGo').disabled=true;m.textContent='Publishing…';
 try{let url=$('fUrl').value.trim()||null;
  if(k==='video'||k==='file'){const f=$('fFile').files[0];if(!f)throw Error('Choose a file');
   const path=$('fSec').value+'/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
   const up=await sb.storage.from('materials').upload(path,f);if(up.error)throw up.error;
   url=sb.storage.from('materials').getPublicUrl(path).data.publicUrl}
  if((k==='youtube'||k==='link')&&!url)throw Error('Paste a link');
  const t=$('fTime').value;
  const{error}=await sb.from('materials').insert({section:$('fSec').value,title:$('fTitle').value,subject:$('fSub').value,description:$('fDesc').value||null,kind:k,url,test_time:t?new Date(t).toISOString():null});
  if(error)throw error;addD.close();$('addF').reset();kindUI();m.textContent='';cur=$('fSec').value;tabs();load()}
 catch(err){m.textContent=err.message}$('fGo').disabled=false};

tabs();load();checkAdmin();if(sb)sb.auth.onAuthStateChange(()=>checkAdmin());
if(sb)sb.channel('mat').on('postgres_changes',{event:'*',schema:'public',table:'materials'},load).subscribe();
</script></body></html>
